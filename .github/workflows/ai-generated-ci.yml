name: TaskLang++ CI

'on':
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flex and Bison
        run: |
          sudo apt-get update
          sudo apt-get install --yes flex bison

      - name: Build
        run: make

      - name: Run TaskLang++ test suite
        run: make test

      - name: Verify clean rebuild
        run: |
          make clean
          make
